name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - layout-fix

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm

    - name: Install Dependencies
      run: npm install

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_LEAD_MOCK: true

    - name: Add .nojekyll
      run: touch out/.nojekyll

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: out